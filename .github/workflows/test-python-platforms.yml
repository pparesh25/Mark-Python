name: Test Python platforms

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "setup_linux.sh"
      - "run_linux.sh"
      - "setup_windows.ps1"
      - "run_windows.cmd"
      - ".github/workflows/test-python-platforms.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "setup_linux.sh"
      - "run_linux.sh"
      - "setup_windows.ps1"
      - "run_windows.cmd"
      - ".github/workflows/test-python-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux Python 3.11
            os: ubuntu-22.04
          - label: Windows Python 3.11
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run cross-platform service tests
        run: >-
          python -m pytest -q
          tests/test_screener_services.py
          tests/test_fast_pipeline.py
          tests/test_rust_binary_install.py
          tests/test_screening_readiness.py
          tests/test_eod_store.py
          tests/test_bse_eod_updates.py
          tests/test_eod_downloader.py
          -k "not test_split_and_bonus_adjustment_only_change_history and not test_symbol_rename_preserves_history"

      - name: Validate Linux launchers
        if: runner.os == 'Linux'
        run: bash -n setup_linux.sh run_linux.sh

      - name: Validate Windows setup script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "setup_windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
