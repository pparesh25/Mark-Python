[package]
name = "stock_analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
polars = { version = "0.36", features = ["lazy", "csv", "dtype-struct", "temporal", "strings", "random", "propagate_nans", "ewma", "rolling_window"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "chrono", "ab_glyph", "line_series", "full_palette"] }
rayon = "1.8"
chrono = "=0.4.38"
anyhow = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
duckdb = { version = "1.1", features = ["bundled"] }
